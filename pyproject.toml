[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-for-personalized-intravesical-bcg-schedule-optimization"
version = "0.1.0"
description = "SA-COG-RL intravesical BCG scheduling research package"
requires-python = ">=3.10"
dependencies = [
  "torch==2.3.1",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.0",
  "pyyaml==6.0.1",
  "tqdm==4.66.4"
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
